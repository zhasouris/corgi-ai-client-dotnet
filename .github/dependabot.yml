version: 2
updates:
  # NuGet package references across the solution.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for routine minor/patch bumps rather than a swarm.
      nuget-minor-patch:
        update-types: [minor, patch]

  # The GitHub Actions used by the workflows (kept SHA-pinned; Dependabot
  # updates the SHA and the trailing version comment together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types: [minor, patch]
